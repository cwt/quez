name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run ruff
        run: poetry run ruff check --select=I,F quez tests scripts

      - name: Run black
        run: poetry run black -t py312 -l 80 --check quez/*.py tests/*.py

      - name: Run mypy
        run: poetry run mypy .

  test:
    name: Test (Python ${{ matrix.python-version }}, extras: ${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        extras: ["none", "zstd"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies (with zstd)
        if: matrix.extras != 'none'
        run: poetry install --with dev --extras ${{ matrix.extras }}

      - name: Install dependencies (without extras)
        if: matrix.extras == 'none'
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest --cov=quez --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.extras == 'zstd'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
